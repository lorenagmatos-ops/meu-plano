function nav(){let tabs=['Hoje','30 dias','Compras','Evolução','Definições'];$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}
function render(){nav();let a=$('app');if(tab==='Hoje'){let d=dateOffset(day),m=menu(day),e=entry(d),check=S.checks[d]||{};let items=[['pa','Pequeno-almoço','Pão proteico 75 g + cottage 20 g + leite proteico 250 ml com cevada'],['lm','Lanche da manhã','1 kiwi + iogurte proteico 125 g'],['al','Almoço',m.r1.title],['lt','Lanche da tarde','Leite proteico 250 ml + '+m.fruit],['so','Sopa ao jantar',m.s.name+' (150–200 ml)'],['ja','Jantar',m.r2.title]];let n=items.filter(x=>check[x[0]]).length;a.innerHTML=`<div class="card"><h2>Dia ${day+1} de 30 · ${d}</h2><div class="days">${Array.from({length:30},(_,i)=>`<button class="pill ${i===day?'sel':''}" onclick="day=${i};render()">${i+1}</button>`).join('')}</div><p class="muted">${n} de ${items.length} refeições assinaladas</p><div class="bar"><span style="width:${n/items.length*100}%"></span></div>${items.map(x=>`<label class="check"><input type="checkbox" ${check[x[0]]?'checked':''} onchange="S.checks['${d}'] ||= {};S.checks['${d}']['${x[0]}']=this.checked;save();render()"><span><b>${x[1]}</b><br><span class="muted">${esc(x[2])}</span></span></label>`).join('')}</div><h2>Receitas do dia</h2><h3>☀️ Almoço</h3>${recipe(m.r1)}<h3>🌙 Jantar</h3><div class="card"><b>🥣 ${m.s.name}</b><p>${m.s.ingredients}</p><details><summary>Receita Bimby TM7</summary><p>${m.s.method}</p></details></div>${recipe(m.r2)}<div class="card"><h2>Registo diário · ${d}</h2>${fields(d,e)}</div>`}
else if(tab==='30 dias'){a.innerHTML=`<div class="card"><h2>30 dias de refeições</h2><p>60 pratos principais com combinações diferentes de proteínas, acompanhamentos e temperos, mais três sopas em rotação. Seleciona um dia para ver as receitas completas.</p><p class="muted">Os nomes e métodos variam; algumas bases e ingredientes repetem-se para simplificar as compras.</p></div>`+Array.from({length:30},(_,i)=>{let m=menu(i);return `<div class="card"><div class="row"><b>Dia ${i+1} · ${dateOffset(i)}</b><button class="btn secondary" onclick="day=${i};tab='Hoje';render()">Ver receitas</button></div><p>☀️ ${esc(m.r1.title)}<br>🥣 ${m.s.name}<br>🌙 ${esc(m.r2.title)}</p></div>`}).join('')}
else if(tab==='Compras'){let all={};for(let i=week*7;i<Math.min(30,week*7+7);i++){let m=menu(i);for(let r of [m.r1,m.r2]){all[r.protein]=(all[r.protein]||0)+r.pgram;all[r.carb+' (cozido)']=(all[r.carb+' (cozido)']||0)+Math.round(r.cgram*portions().adjustment);all[r.veg]=(all[r.veg]||0)+r.vgram;all['azeite (g)']=(all['azeite (g)']||0)+r.oil}all[m.fruit]=(all[m.fruit]||0)+1;all['kiwi']=(all['kiwi']||0)+1;all['iogurte proteico (125 g)']=(all['iogurte proteico (125 g)']||0)+1;all['pão proteico (75 g)']=(all['pão proteico (75 g)']||0)+1;all['cottage (20 g)']=(all['cottage (20 g)']||0)+1;all['leite proteico (250 ml)']=(all['leite proteico (250 ml)']||0)+2;all[m.s.name+' (200 ml)']=(all[m.s.name+' (200 ml)']||0)+1}let items=Object.entries(all);a.innerHTML=`<div class="card"><h2>🛒 Lista de compras</h2><div class="days">${[0,1,2,3,4].map(i=>`<button class="pill ${week===i?'sel':''}" onclick="week=${i};render()">Semana ${i+1}</button>`).join('')}</div><p class="muted">Quantidades estimadas para uma pessoa; os acompanhamentos são pesados cozidos. Sopas: quantidades por dose; consulta as receitas para ingredientes crus. Verifica o que já tens.</p>${items.map(([k,v])=>{let id=week+'-'+k;return `<label class="check"><input type="checkbox" ${S.shopping[id]?'checked':''} onchange="S.shopping['${id}']=this.checked;save()"><span>${esc(k)} — <b>${fmt(v)} ${k.includes('(g)')||k.includes('cozido')||['tofu','almôndegas vegan'].some(q=>k.includes(q))||k.includes('curgete')||k.includes('espinafres')||k.includes('cenoura')||k.includes('abóbora')?'g':'un.'}</b></span></label>`}).join('')}<button class="btn" onclick="navigator.clipboard?.writeText(${JSON.stringify('') }+Array.from(document.querySelectorAll('.check span')).map(x=>x.innerText).join('\n')).then(()=>alert('Lista copiada')).catch(()=>alert('Usa selecionar e copiar'))">Copiar lista</button></div>`}
else if(tab==='Evolução'){let rows=Object.entries(S.entries).sort((a,b)=>a[0].localeCompare(b[0]));let weights=rows.filter(x=>+x[1].weight>0);let avg=weights.slice(-7).reduce((s,x)=>s+(+x[1].weight),0)/(weights.slice(-7).length||1);a.innerHTML=`<div class="card"><h2>⚖️ Evolução</h2><div class="two"><div><small>Peso mais recente</small><h2>${fmt(latestWeight())} kg</h2></div><div><small>Média dos últimos 7 registos</small><h2>${weights.length?fmt(avg)+' kg':'—'}</h2></div></div><p>Objetivo: ${S.goal} kg. O peso diário oscila; observa a tendência, não apenas um dia.</p>${weights.length>1?graph(weights):'<p class="empty">Regista pelo menos dois pesos para veres o gráfico.</p>'}</div><div class="card"><h2>Histórico</h2>${rows.slice().reverse().slice(0,35).map(([d,e])=>`<p><b>${d}</b> · ${e.weight||'—'} kg · ${e.water||0} ml água · ${e.exercise||'sem exercício registado'} · ${e.sleep||'—'} h sono · evacuação: ${e.bowel||'—'} · inchaço: ${e.bloat||'—'}/5</p>`).join('')||'<p>Sem registos.</p>'}</div>`}
else{a.innerHTML=`<div class="card"><h2>Definições</h2><label>Data de início do plano</label><input type="date" value="${S.start}" onchange="S.start=this.value;save();render()"><label>Peso de referência (kg)</label><input type="number" step="0.1" value="${S.weight}" onchange="S.weight=+this.value;save();render()"><label>Objetivo de peso (kg)</label><input type="number" step="0.1" value="${S.goal}" onchange="S.goal=+this.value;save();render()"><label>Meta inicial de água (ml/dia)</label><input type="number" step="100" value="${S.water}" onchange="S.water=+this.value;save();render()"><p class="notice muted">A meta de água é ajustável e não representa uma prescrição médica. As porções de hidratos variam ligeiramente com o peso registado, mas a proteína não é reduzida automaticamente. Não é um plano nutricional clinicamente validado.</p><p class="notice muted">Samsung Watch 6: não há sincronização automática nesta versão. Os dados podem ser registados manualmente a partir do Samsung Health. Uma integração direta requer desenvolvimento Android e permissões Health Connect/Samsung Health.</p><button class="btn" onclick="exportData()">Exportar os meus dados (JSON)</button><label>Importar cópia de segurança</label><input type="file" accept="application/json" onchange="importData(this.files[0])"><p class="muted">Os dados ficam guardados neste navegador. Não há conta nem servidor.</p></div>`}}
function fields(d,e){return `<div class="two"><div><label>Peso (kg)</label><input type="number" min="30" max="250" step="0.1" value="${e.weight||''}" placeholder="66,6" onchange="setEntry('${d}','weight',+this.value)"></div><div><label>Água (ml)</label><input type="number" min="0" step="100" value="${e.water||0}" onchange="setEntry('${d}','water',+this.value)"></div></div><p class="muted">Meta de água: ${S.water} ml · ${Math.round((e.water||0)/S.water*100)}% atingido</p><div class="bar"><span style="width:${Math.min(100,(e.water||0)/S.water*100)}%"></span></div><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="setEntry('${d}','water',+(entry('${d}').water||0)+250)">+250 ml</button><button class="btn secondary" onclick="setEntry('${d}','water',+(entry('${d}').water||0)+500)">+500 ml</button></div><label>Exercício</label><select onchange="setEntry('${d}','exercise',this.value)">${['','Natação','Musculação','Cycling','Caminhada','Descanso','Outro'].map(x=>`<option ${e.exercise===x?'selected':''}>${x}</option>`).join('')}</select><div class="two"><div><label>Duração (min)</label><input type="number" min="0" value="${e.minutes||''}" onchange="setEntry('${d}','minutes',+this.value)"></div><div><label>Passos</label><input type="number" min="0" value="${e.steps||''}" onchange="setEntry('${d}','steps',+this.value)"></div></div><div class="two"><div><label>Sono (horas)</label><input type="number" min="0" max="24" step="0.1" value="${e.sleep||''}" onchange="setEntry('${d}','sleep',+this.value)"></div><div><label>Inchaço (0–5)</label><select onchange="setEntry('${d}','bloat',this.value)">${['','0','1','2','3','4','5'].map(x=>`<option ${e.bloat===x?'selected':''}>${x}</option>`).join('')}</select></div></div><label>Evacuação</label><select onchange="setEntry('${d}','bowel',this.value)">${['','Não','Sim, sem dificuldade','Sim, com esforço'].map(x=>`<option ${e.bowel===x?'selected':''}>${x}</option>`).join('')}</select><label>Notas (digestão, treino, sono)</label><textarea rows="2" onblur="setEntry('${d}','notes',this.value)">${esc(e.notes||'')}</textarea>`}
function graph(weights){let a=weights.slice(-30),vs=a.map(x=>+x[1].weight),lo=Math.min(...vs)-.5,hi=Math.max(...vs)+.5,pts=vs.map((v,i)=>`${25+i*290/Math.max(1,vs.length-1)},${120-(v-lo)/(hi-lo)*100}`).join(' ');return `<svg viewBox="0 0 340 145" width="100%" role="img" aria-label="Gráfico de peso"><line x1="25" x2="315" y1="120" y2="120" stroke="#ccc"/><polyline points="${pts}" fill="none" stroke="#267955" stroke-width="3"/>${vs.map((v,i)=>`<circle cx="${25+i*290/Math.max(1,vs.length-1)}" cy="${120-(v-lo)/(hi-lo)*100}" r="3" fill="#267955"/>`).join('')}<text x="5" y="20" font-size="10">${fmt(hi)}</text><text x="5" y="120" font-size="10">${fmt(lo)}</text></svg>`}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='meu-plano-backup.json';a.click();URL.revokeObjectURL(u)}
async function importData(f){if(!f)return;try{let v=JSON.parse(await f.text());if(!v.entries)throw Error();if(confirm('Substituir os registos atuais pelos da cópia?')){S=v;save();render()}}catch{alert('Ficheiro inválido')}}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
